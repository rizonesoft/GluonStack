<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chosen brand: Bond mark in Field colours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B6F36A}a:hover{color:#D3F9A4}
</style>
</helmet>
<div style="width: 880px; height: 800px; box-sizing: border-box; padding: 56px; background: #07090A; color: #D7E3DC; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; gap: 40px">
  <div style="display: flex; align-items: center; gap: 20px">
    <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true"><rect x="1" y="1" width="62" height="62" rx="10" fill="#0F1312" stroke="#1F2724" stroke-width="2"/><path d="M42.9 19 A17 17 0 1 0 49 32 L32 32" fill="none" stroke="#D7E3DC" stroke-width="5" stroke-linecap="round"/><circle cx="42.9" cy="19" r="5.5" fill="#B6F36A"/><circle cx="32" cy="32" r="5.5" fill="#B6F36A"/></svg>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 40px; font-weight: 700; letter-spacing: -0.02em">GluonStack</div>
      <div style="font: 14px 'JetBrains Mono', monospace; color: #8FA39A">chosen: the Bond G, in Field colours and layout</div>
    </div>
  </div>

  <div style="display: flex; gap: 36px; align-items: flex-end">
    <svg width="256" height="256" viewBox="0 0 64 64" role="img" aria-label="GluonStack app icon at 256 pixels"><rect x="1" y="1" width="62" height="62" rx="10" fill="#0F1312" stroke="#1F2724" stroke-width="2"/><path d="M42.9 19 A17 17 0 1 0 49 32 L32 32" fill="none" stroke="#D7E3DC" stroke-width="5" stroke-linecap="round"/><circle cx="42.9" cy="19" r="5.5" fill="#B6F36A"/><circle cx="32" cy="32" r="5.5" fill="#B6F36A"/></svg>
    <div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
      <svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Icon at 64 pixels"><rect x="1" y="1" width="62" height="62" rx="10" fill="#0F1312" stroke="#1F2724" stroke-width="2"/><path d="M42.9 19 A17 17 0 1 0 49 32 L32 32" fill="none" stroke="#D7E3DC" stroke-width="5" stroke-linecap="round"/><circle cx="42.9" cy="19" r="5.5" fill="#B6F36A"/><circle cx="32" cy="32" r="5.5" fill="#B6F36A"/></svg>
      <span style="font: 12px 'JetBrains Mono', monospace; color: #8FA39A">64</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
      <svg width="32" height="32" viewBox="0 0 64 64" role="img" aria-label="Icon at 32 pixels"><rect width="64" height="64" rx="10" fill="#0F1312"/><path d="M42.9 19 A17 17 0 1 0 49 32 L32 32" fill="none" stroke="#D7E3DC" stroke-width="6.5" stroke-linecap="round"/><circle cx="42.9" cy="19" r="7" fill="#B6F36A"/><circle cx="32" cy="32" r="7" fill="#B6F36A"/></svg>
      <span style="font: 12px 'JetBrains Mono', monospace; color: #8FA39A">32</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
      <svg width="16" height="16" viewBox="0 0 64 64" role="img" aria-label="Icon at 16 pixels"><rect width="64" height="64" rx="12" fill="#B6F36A"/><path d="M44 18 A18 18 0 1 0 50 32 L32 32" fill="none" stroke="#07090A" stroke-width="9" stroke-linecap="round"/></svg>
      <span style="font: 12px 'JetBrains Mono', monospace; color: #8FA39A">16</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
      <svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Solid variant at 64 pixels"><rect width="64" height="64" rx="10" fill="#B6F36A"/><path d="M42.9 19 A17 17 0 1 0 49 32 L32 32" fill="none" stroke="#07090A" stroke-width="5" stroke-linecap="round"/><circle cx="42.9" cy="19" r="5.5" fill="#07090A"/><circle cx="32" cy="32" r="5.5" fill="#07090A"/></svg>
      <span style="font: 12px 'JetBrains Mono', monospace; color: #8FA39A">solid</span>
    </div>
  </div>

  <div style="display: flex; gap: 32px; align-items: center; border-top: 1px solid #1F2724; padding-top: 28px">
    <span style="font-size: 13px; color: #8FA39A; width: 120px">Tray states</span>
    <div style="display: flex; align-items: center; gap: 10px"><svg width="24" height="24" viewBox="0 0 64 64" role="img" aria-label="All running"><rect width="64" height="64" rx="12" fill="#B6F36A"/><path d="M44 18 A18 18 0 1 0 50 32 L32 32" fill="none" stroke="#07090A" stroke-width="9" stroke-linecap="round"/></svg><span style="font: 13px 'JetBrains Mono', monospace">all running</span></div>
    <div style="display: flex; align-items: center; gap: 10px"><svg width="24" height="24" viewBox="0 0 64 64" role="img" aria-label="Some stopped"><rect width="64" height="64" rx="12" fill="#FBBF24"/><path d="M44 18 A18 18 0 1 0 50 32 L32 32" fill="none" stroke="#07090A" stroke-width="9" stroke-linecap="round" stroke-dasharray="16 14"/></svg><span style="font: 13px 'JetBrains Mono', monospace">some stopped</span></div>
    <div style="display: flex; align-items: center; gap: 10px"><svg width="24" height="24" viewBox="0 0 64 64" role="img" aria-label="All stopped"><rect x="3" y="3" width="58" height="58" rx="10" fill="none" stroke="#8FA39A" stroke-width="6"/><path d="M44 20 A16 16 0 1 0 48 32 L32 32" fill="none" stroke="#8FA39A" stroke-width="8" stroke-linecap="round"/></svg><span style="font: 13px 'JetBrains Mono', monospace">all stopped</span></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 48px; border-radius: 4px; background: #07090A; border: 1px solid #1F2724"></div><span style="font: 12px 'JetBrains Mono', monospace; color: #8FA39A">void #07090A</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 48px; border-radius: 4px; background: #0F1312; border: 1px solid #1F2724"></div><span style="font: 12px 'JetBrains Mono', monospace; color: #8FA39A">panel #0F1312</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 48px; border-radius: 4px; background: #D7E3DC"></div><span style="font: 12px 'JetBrains Mono', monospace; color: #8FA39A">text #D7E3DC</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 48px; border-radius: 4px; background: #B6F36A"></div><span style="font: 12px 'JetBrains Mono', monospace; color: #8FA39A">phosphor #B6F36A</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 48px; border-radius: 4px; background: #5EEAD4"></div><span style="font: 12px 'JetBrains Mono', monospace; color: #8FA39A">signal #5EEAD4</span></div>
    <div style="display: flex; flex-direction: column; gap: 8px"><div style="height: 48px; border-radius: 4px; background: #FBBF24"></div><span style="font: 12px 'JetBrains Mono', monospace; color: #8FA39A">caution #FBBF24</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
